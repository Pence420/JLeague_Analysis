services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jscout
      POSTGRES_USER: jscout_app
      POSTGRES_PASSWORD: jscout_local
    ports:
      - "5432:5432"
    volumes:
      - jscout_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jscout_app -d jscout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jscout_postgres:
